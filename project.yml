name: InverterLink
options:
  bundleIdPrefix: me.balaj
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Select your own development team in Xcode.
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: '20261013.9'
    MARKETING_VERSION: '0.1.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  InverterLink:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: InverterLinkWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.balaj.InverterLink
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inverter Link
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Find and control your solar inverter on your Wi-Fi network.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  InverterLinkWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Inverter Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.balaj.InverterLink.Activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  InverterLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InverterLink
schemes:
  InverterLink:
    build:
      targets:
        InverterLink: all
    test:
      environmentVariables:
        INVERTER_LINK_TESTING: '1'
      targets:
        - InverterLinkTests
